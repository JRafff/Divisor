<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="330" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="bold" fill="#222">One iteration in the {RH, Z} register</text>

  <!-- step 1 label and arrow -->
  <text x="60" y="70" fill="#6a1b9a" font-weight="bold">① shift {RH, Z} left by one   →   RH ← 2·RH + z</text>
  <line x1="700" y1="88" x2="70" y2="88" stroke="#6a1b9a" stroke-width="2" marker-end="url(#arp)"/>

  <!-- RH -->
  <rect x="60" y="110" width="320" height="56" fill="#f3e5f5" stroke="#222" stroke-width="1.6"/>
  <line x1="102" y1="110" x2="102" y2="166" stroke="#222" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="81" y="143" text-anchor="middle" font-weight="bold">s</text>
  <text x="241" y="134" text-anchor="middle" font-weight="bold">RH  (N+1 bit)</text>
  <text x="241" y="153" text-anchor="middle" font-size="11.5">partial remainder, two's complement</text>
  <text x="81" y="184" text-anchor="middle" font-size="11" fill="#555">sign</text>
  <!-- Z/Q -->
  <rect x="380" y="110" width="330" height="56" fill="#fff3e0" stroke="#222" stroke-width="1.6"/>
  <line x1="422" y1="110" x2="422" y2="166" stroke="#222" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="668" y1="110" x2="668" y2="166" stroke="#222" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="401" y="143" text-anchor="middle" font-weight="bold">z</text>
  <text x="545" y="134" text-anchor="middle" font-weight="bold">Z / Q  (N bit)</text>
  <text x="545" y="153" text-anchor="middle" font-size="11.5">dividend bits out ← | ← quotient bits in</text>
  <text x="689" y="143" text-anchor="middle" font-weight="bold">q</text>
  <text x="401" y="184" text-anchor="middle" font-size="11" fill="#555">MSB</text>
  <text x="689" y="184" text-anchor="middle" font-size="11" fill="#555">LSB</text>

  <!-- step 2 -->
  <line x1="220" y1="166" x2="220" y2="214" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="60" y="216" width="330" height="66" rx="10" fill="#e8f5e9" stroke="#222" stroke-width="1.6"/>
  <text x="225" y="238" text-anchor="middle" font-weight="bold">② add or subtract D</text>
  <text x="225" y="257" text-anchor="middle" font-size="12">old sign s = 0 → RH ← RH − D</text>
  <text x="225" y="274" text-anchor="middle" font-size="12">old sign s = 1 → RH ← RH + D</text>

  <!-- step 3 -->
  <polyline points="390,245 760,245 760,140 714,140" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="430" y="270" font-weight="bold">③ q = NOT (new sign of RH)</text>
  <text x="430" y="288" font-size="12">written into the bit freed by the shift</text>

  <text x="60" y="318" font-size="12" fill="#444">After N iterations the dividend has shifted out completely and Z holds the quotient Q.</text>
</svg>
