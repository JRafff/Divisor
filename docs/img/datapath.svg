<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="bold" fill="#222">Datapath — non-restoring divider, N bit</text>

  <!-- ============ A-input MUX ============ -->
  <polygon points="120,100 200,100 185,132 135,132" fill="#fff8e1" stroke="#222" stroke-width="1.6"/>
  <text x="160" y="122" text-anchor="middle" font-size="11" font-weight="bold">MUX</text>
  <text x="140" y="95" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="180" y="95" text-anchor="middle" font-size="11" fill="#555">1</text>
  <line x1="160" y1="132" x2="160" y2="174" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="167" y="160" font-size="11" fill="#555">A</text>
  <line x1="262" y1="116" x2="195" y2="116" stroke="#c62828" stroke-width="1.6" marker-end="url(#arc)"/>
  <text x="268" y="120" fill="#c62828" font-weight="bold">SEL_SH</text>

  <!-- ============ D register ============ -->
  <rect x="340" y="70" width="140" height="48" fill="#e3f2fd" stroke="#222" stroke-width="1.6"/>
  <text x="410" y="99" text-anchor="middle" font-weight="bold">D  (N bit)</text>
  <line x1="410" y1="46" x2="410" y2="68" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arb)"/>
  <text x="418" y="52" fill="#1565c0" font-weight="bold">divisor</text>
  <text x="488" y="99" fill="#c62828" font-weight="bold" font-size="12">LD</text>
  <line x1="410" y1="118" x2="410" y2="174" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="418" y="146" font-size="12">{1'b0, D}</text>
  <text x="418" y="162" font-size="11" fill="#555">B</text>

  <!-- ============ ADD / SUB ============ -->
  <polygon points="110,176 460,176 405,256 165,256" fill="#e8f5e9" stroke="#222" stroke-width="1.8"/>
  <text x="285" y="214" text-anchor="middle" font-weight="bold" font-size="15">ADD / SUB  (N+1 bit)</text>
  <text x="285" y="234" text-anchor="middle" font-size="12">S = A − B  or  S = A + B</text>
  <line x1="570" y1="216" x2="436" y2="216" stroke="#c62828" stroke-width="1.6" marker-end="url(#arc)"/>
  <text x="576" y="212" fill="#c62828" font-weight="bold">ADD_SUB</text>
  <text x="576" y="228" fill="#c62828" font-size="11">1 = subtract D</text>
  <text x="576" y="242" fill="#c62828" font-size="11">0 = add D</text>

  <!-- S to RH -->
  <line x1="285" y1="256" x2="285" y2="398" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="293" y="352" font-size="12">S  (N+1)</text>
  <!-- S[N] -> inverter -> q into Z/Q LSB -->
  <circle cx="285" cy="296" r="3.5" fill="#222"/>
  <line x1="285" y1="296" x2="560" y2="296" stroke="#222" stroke-width="1.5"/>
  <text x="300" y="288" font-size="12">S[N] = sign of the new remainder</text>
  <polygon points="560,286 560,306 582,296" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <circle cx="586" cy="296" r="4" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <polyline points="590,296 622,296 622,398" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="630" y="352" font-size="12">q = ~S[N]</text>
  <text x="630" y="367" font-size="11" fill="#555">(enters the LSB)</text>

  <!-- ============ RH | Z/Q register ============ -->
  <rect x="150" y="400" width="240" height="52" fill="#f3e5f5" stroke="#222" stroke-width="1.8"/>
  <text x="270" y="423" text-anchor="middle" font-weight="bold">RH  (N+1 bit, signed)</text>
  <text x="270" y="441" text-anchor="middle" font-size="11">partial remainder</text>
  <rect x="390" y="400" width="250" height="52" fill="#fff3e0" stroke="#222" stroke-width="1.8"/>
  <text x="515" y="423" text-anchor="middle" font-weight="bold">Z / Q  (N bit)</text>
  <text x="515" y="441" text-anchor="middle" font-size="11">dividend bits out ← | ← quotient bits in</text>
  <text x="154" y="394" font-size="11" fill="#555">MSB = sign</text>
  <path d="M 420 394 Q 390 372 360 394" fill="none" stroke="#6a1b9a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="330" y="372" font-size="11" fill="#6a1b9a">Z[N−1] → RH</text>
  <line x1="480" y1="340" x2="480" y2="398" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arb)"/>
  <text x="488" y="352" fill="#1565c0" font-weight="bold">dividend</text>

  <!-- register control labels -->
  <text x="198" y="472" fill="#c62828" font-size="11.5"><tspan font-weight="bold">LD</tspan>: RH ← 0</text>
  <text x="198" y="488" fill="#c62828" font-size="11.5"><tspan font-weight="bold">EN_R</tspan>: RH ← S</text>
  <text x="400" y="472" fill="#c62828" font-size="11.5"><tspan font-weight="bold">LD</tspan>: Z ← dividend</text>
  <text x="400" y="488" fill="#c62828" font-size="11.5"><tspan font-weight="bold">EN_Z</tspan>: Z ← {Z[N−2:0], q}</text>

  <!-- feedback 0 : RH unshifted (correction) -->
  <polyline points="185,452 185,510 70,510 70,78 140,78 140,98" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="78" y="504" font-size="11.5">0: RH</text>
  <!-- feedback 1 : shifted {RH[N-1:0], Z[N-1]} -->
  <circle cx="390" cy="452" r="3.5" fill="#222"/>
  <polyline points="390,452 390,540 40,540 40,58 180,58 180,98" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="48" y="534" font-size="11.5">1: {RH[N−1:0], Z[N−1]} = 2·RH + z</text>

  <!-- outputs -->
  <line x1="350" y1="452" x2="350" y2="606" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arb)"/>
  <text x="358" y="602" fill="#1565c0" font-weight="bold">remainder = RH[N−1:0]</text>
  <line x1="640" y1="426" x2="712" y2="426" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arb)"/>
  <text x="648" y="418" fill="#1565c0" font-weight="bold">quotient</text>

  <!-- ============ counter ============ -->
  <rect x="740" y="470" width="190" height="50" fill="#eceff1" stroke="#222" stroke-width="1.6"/>
  <text x="835" y="492" text-anchor="middle" font-weight="bold">CNT  (⌈log₂N⌉ bit)</text>
  <text x="835" y="509" text-anchor="middle" font-size="11">cnt_last = (CNT == N−1)</text>
  <text x="740" y="540" fill="#c62828" font-size="11.5"><tspan font-weight="bold">LD</tspan>: CNT ← 0</text>
  <text x="740" y="556" fill="#c62828" font-size="11.5"><tspan font-weight="bold">EN_CNT</tspan>: CNT ← CNT + 1</text>

  <!-- ============ control unit ============ -->
  <rect x="700" y="62" width="280" height="200" rx="8" fill="#fafafa" stroke="#c62828" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="840" y="88" text-anchor="middle" font-weight="bold" font-size="14" fill="#c62828">Control unit (see ASM chart)</text>
  <text x="714" y="116" font-size="12" font-weight="bold">status in</text>
  <text x="714" y="134" font-size="12">start,  S[N] (new sign),  cnt_last</text>
  <text x="714" y="164" font-size="12" font-weight="bold">control out</text>
  <text x="714" y="182" font-size="12" fill="#c62828">LD,  EN_R,  EN_Z,  EN_CNT,</text>
  <text x="714" y="200" font-size="12" fill="#c62828">SEL_SH,  ADD_SUB</text>
  <text x="714" y="230" font-size="12" font-weight="bold">handshake out</text>
  <text x="714" y="248" font-size="12" fill="#1565c0">done</text>

  <!-- legend -->
  <line x1="700" y1="616" x2="726" y2="616" stroke="#222" stroke-width="1.8"/><text x="732" y="620" font-size="11">data</text>
  <line x1="776" y1="616" x2="802" y2="616" stroke="#c62828" stroke-width="1.8"/><text x="808" y="620" font-size="11" fill="#c62828">control</text>
  <line x1="866" y1="616" x2="892" y2="616" stroke="#1565c0" stroke-width="1.8"/><text x="898" y="620" font-size="11" fill="#1565c0">I/O ports</text>
</svg>
