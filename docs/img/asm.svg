<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 930" width="880" height="930" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="930" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="bold" fill="#222">ASM chart — control unit (Moore: outputs depend on the state only)</text>

  <!-- ================= IDLE ================= -->
  <rect x="320" y="58" width="240" height="46" fill="#e3f2fd" stroke="#222" stroke-width="1.6"/>
  <text x="328" y="75" font-weight="bold" font-size="14">IDLE</text>
  <text x="440" y="94" text-anchor="middle" font-size="12" fill="#555">no outputs (registers hold)</text>
  <line x1="440" y1="104" x2="440" y2="122" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <polygon points="440,124 498,152 440,180 382,152" fill="#fff8e1" stroke="#222" stroke-width="1.6"/>
  <text x="440" y="157" text-anchor="middle" font-weight="bold">start</text>
  <polyline points="382,152 270,152 270,81 318,81" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="360" y="145" font-size="12">0</text>
  <line x1="440" y1="180" x2="440" y2="206" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="448" y="198" font-size="12">1</text>

  <!-- ================= LOAD ================= -->
  <rect x="290" y="208" width="300" height="58" fill="#e3f2fd" stroke="#222" stroke-width="1.6"/>
  <text x="298" y="225" font-weight="bold" font-size="14">LOAD</text>
  <text x="440" y="240" text-anchor="middle" font-weight="bold" fill="#c62828">LD = 1</text>
  <text x="440" y="257" text-anchor="middle" font-size="11.5">RH ← 0, CNT ← 0, D ← divisor, Z ← dividend</text>
  <polyline points="440,266 440,292 250,292 250,318" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="452" y="304" font-size="11.5" fill="#555">first iteration always subtracts (RH = 0)</text>

  <!-- ================= SUB ================= -->
  <rect x="110" y="320" width="280" height="84" fill="#e3f2fd" stroke="#222" stroke-width="1.6"/>
  <text x="118" y="337" font-weight="bold" font-size="14">SUB</text>
  <text x="250" y="356" text-anchor="middle" font-size="12" fill="#c62828"><tspan font-weight="bold">ADD_SUB = 1</tspan>,  SEL_SH = 1</text>
  <text x="250" y="374" text-anchor="middle" font-size="12" fill="#c62828">EN_R = 1,  EN_Z = 1,  EN_CNT = 1</text>
  <text x="250" y="394" text-anchor="middle" font-size="11.5">RH ← 2·RH + z − D,  Z ← {Z, q}</text>

  <!-- ================= ADD ================= -->
  <rect x="490" y="320" width="280" height="84" fill="#e3f2fd" stroke="#222" stroke-width="1.6"/>
  <text x="498" y="337" font-weight="bold" font-size="14">ADD</text>
  <text x="630" y="356" text-anchor="middle" font-size="12" fill="#c62828"><tspan font-weight="bold">ADD_SUB = 0</tspan>,  SEL_SH = 1</text>
  <text x="630" y="374" text-anchor="middle" font-size="12" fill="#c62828">EN_R = 1,  EN_Z = 1,  EN_CNT = 1</text>
  <text x="630" y="394" text-anchor="middle" font-size="11.5">RH ← 2·RH + z + D,  Z ← {Z, q}</text>

  <!-- shared exit logic -->
  <polyline points="250,404 250,428 440,428" fill="none" stroke="#222" stroke-width="1.5"/>
  <polyline points="630,404 630,428 440,428" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="440" y1="428" x2="440" y2="450" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="452" y="446" font-size="11" fill="#555">same exit logic for SUB and ADD</text>
  <polygon points="440,452 506,482 440,512 374,482" fill="#fff8e1" stroke="#222" stroke-width="1.6"/>
  <text x="440" y="479" text-anchor="middle" font-weight="bold">S[N]</text>
  <text x="440" y="495" text-anchor="middle" font-size="11">new sign</text>

  <!-- S[N] = 0 : left cnt_last -->
  <polyline points="374,482 250,482 250,538" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="262" y="474" font-size="12">0  (new RH ≥ 0)</text>
  <polygon points="250,540 316,570 250,600 184,570" fill="#fff8e1" stroke="#222" stroke-width="1.6"/>
  <text x="250" y="575" text-anchor="middle" font-weight="bold">cnt_last</text>
  <!-- left: 0 -> SUB -->
  <polyline points="184,570 70,570 70,362 108,362" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="150" y="563" font-size="12">0</text>
  <text x="78" y="470" font-size="11.5" fill="#555">next: SUB</text>
  <!-- left: 1 -> DONE -->
  <polyline points="250,600 250,812 368,812" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="258" y="620" font-size="12">1  (no correction needed)</text>

  <!-- S[N] = 1 : right cnt_last -->
  <polyline points="506,482 630,482 630,538" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="514" y="474" font-size="12">1  (new RH &lt; 0)</text>
  <polygon points="630,540 696,570 630,600 564,570" fill="#fff8e1" stroke="#222" stroke-width="1.6"/>
  <text x="630" y="575" text-anchor="middle" font-weight="bold">cnt_last</text>
  <!-- right: 0 -> ADD -->
  <polyline points="696,570 800,570 800,362 772,362" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="704" y="563" font-size="12">0</text>
  <text x="808" y="470" font-size="11.5" fill="#555">next:</text>
  <text x="808" y="485" font-size="11.5" fill="#555">ADD</text>
  <!-- right: 1 -> CORR -->
  <line x1="630" y1="600" x2="630" y2="660" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="638" y="626" font-size="12">1</text>

  <!-- ================= CORR ================= -->
  <rect x="490" y="662" width="280" height="76" fill="#e3f2fd" stroke="#222" stroke-width="1.6"/>
  <text x="498" y="679" font-weight="bold" font-size="14">CORR</text>
  <text x="630" y="698" text-anchor="middle" font-size="12" fill="#c62828">EN_R = 1,  SEL_SH = 0,  ADD_SUB = 0</text>
  <text x="630" y="716" text-anchor="middle" font-size="11.5">RH ← RH + D</text>
  <text x="630" y="731" text-anchor="middle" font-size="11" fill="#555">no shift, Z does not move</text>
  <polyline points="630,738 630,812 512,812" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ================= DONE ================= -->
  <rect x="370" y="790" width="140" height="46" fill="#e3f2fd" stroke="#222" stroke-width="1.6"/>
  <text x="378" y="807" font-weight="bold" font-size="14">DONE</text>
  <text x="440" y="826" text-anchor="middle" font-weight="bold" fill="#1565c0">done = 1</text>
  <text x="250" y="858" font-size="11.5" fill="#555">quotient = Z,  remainder = RH[N−1:0]</text>
  <polyline points="500,836 500,872 850,872 850,81 562,81" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="700" y="73" font-size="11.5" fill="#555" text-anchor="middle">back to IDLE</text>

  <!-- legend -->
  <rect x="24" y="895" width="26" height="16" fill="#e3f2fd" stroke="#222"/><text x="56" y="908" font-size="11.5">state with its (Moore) outputs</text>
  <polygon points="250,903 264,895 278,903 264,911" fill="#fff8e1" stroke="#222"/><text x="284" y="908" font-size="11.5">decision (next-state logic only)</text>
  <text x="520" y="908" font-size="11" fill="#555">S[N] = sign at the adder output in this cycle</text>
</svg>
